<!doctype html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HPE musikk-jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f0f7ff;
    --bg-a: #f8fbff;
    --bg-b: #e8f2ff;
    --glow-1: rgb(125 211 252 / 42%);
    --glow-2: rgb(196 181 253 / 38%);
    --ink: #172554;
    --ink-soft: #64748b;
    --accent: #2563eb;
    --surface: rgb(255 255 255 / 75%);
    --surface-solid: #ffffff;
    --panel: #f8fbff;
    --line: #dbeafe;
    --line-strong: #bfdbfe;
    --btn-dark: #172554;
    --btn-dark-hover: #243b78;
    --btn-dark-ink: #ffffff;
    --btn-light-ink: #1d4ed8;
    --btn-light-hover: #eff6ff;
    --shadow: 0 20px 25px -5px rgb(15 23 42 / 10%), 0 8px 10px -6px rgb(15 23 42 / 10%);
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
    font-synthesis: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #070d24;
      --bg-a: #0a1230;
      --bg-b: #060b1f;
      --glow-1: rgb(37 99 235 / 28%);
      --glow-2: rgb(139 92 246 / 24%);
      --ink: #e8efff;
      --ink-soft: #94a3b8;
      --accent: #7cb2ff;
      --surface: rgb(15 23 52 / 70%);
      --surface-solid: #111a3d;
      --panel: #0d1534;
      --line: #22305c;
      --line-strong: #2d3e74;
      --btn-dark: #e8efff;
      --btn-dark-hover: #c9d8ff;
      --btn-dark-ink: #0b1433;
      --btn-light-ink: #9cc3ff;
      --btn-light-hover: #18234d;
      --shadow: 0 20px 30px -8px rgb(0 0 0 / 50%);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #070d24; --bg-a: #0a1230; --bg-b: #060b1f;
    --glow-1: rgb(37 99 235 / 28%); --glow-2: rgb(139 92 246 / 24%);
    --ink: #e8efff; --ink-soft: #94a3b8; --accent: #7cb2ff;
    --surface: rgb(15 23 52 / 70%); --surface-solid: #111a3d; --panel: #0d1534;
    --line: #22305c; --line-strong: #2d3e74;
    --btn-dark: #e8efff; --btn-dark-hover: #c9d8ff; --btn-dark-ink: #0b1433;
    --btn-light-ink: #9cc3ff; --btn-light-hover: #18234d;
    --shadow: 0 20px 30px -8px rgb(0 0 0 / 50%);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-width: 320px;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 3px; }

  .display-font { font-family: "Anton", "Impact", "Arial Narrow", sans-serif; font-weight: 400; }

  .background-glow {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 13% 5%, var(--glow-1), transparent 27rem),
      radial-gradient(circle at 91% 82%, var(--glow-2), transparent 30rem),
      linear-gradient(145deg, var(--bg-a) 0%, var(--bg-b) 100%);
  }

  .page {
    position: relative;
    margin: 0 auto;
    display: flex; flex-direction: column;
    min-height: 100vh; min-height: 100dvh;
    width: 100%; max-width: 1480px;
    padding: 20px 16px;
  }
  @media (min-width: 640px) { .page { padding: 20px 28px; } }
  @media (min-width: 1024px) { .page { padding: 28px 40px; } }

  header {
    margin-bottom: 16px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  }
  .event {
    margin: 0 0 6px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.38em;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-size: 2.25rem; line-height: 1; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--ink);
  }
  @media (min-width: 640px) { .event { font-size: 12px; } h1 { font-size: 3rem; } }
  @media (min-width: 1024px) { h1 { font-size: 3.75rem; } }

  .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .pill {
    border-radius: 999px; padding: 10px 12px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
    transition: background-color 150ms, border-color 150ms;
  }
  .pill-dark { border: 0; background: var(--btn-dark); color: var(--btn-dark-ink); box-shadow: 0 4px 6px -1px rgb(0 0 0 / 12%); }
  .pill-dark:hover { background: var(--btn-dark-hover); }
  .pill-light { border: 1px solid var(--line-strong); background: var(--surface-solid); color: var(--btn-light-ink); }
  .pill-light:hover { background: var(--btn-light-hover); }
  .short { display: inline; } .long { display: none; }
  @media (min-width: 640px) {
    .pill { padding: 10px 20px; font-size: 12px; letter-spacing: 0.16em; }
    .pill-light { padding: 10px 16px; }
    .short { display: none; } .long { display: inline; }
  }

  .board-shell {
    display: flex; flex: 1; min-height: 0;
    border-radius: 16px; border: 1px solid var(--line);
    background: var(--surface);
    padding: 8px;
    box-shadow: var(--shadow);
    overflow-x: auto;
    scrollbar-color: #93c5fd transparent;
    scrollbar-width: thin;
  }
  @media (min-width: 640px) { .board-shell { padding: 12px; } }

  .quiz-board {
    display: grid; flex: 1;
    min-width: 860px; min-height: 570px;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(0, 1fr));
    gap: 6px;
  }
  @media (min-width: 640px) { .quiz-board { gap: 8px; } }
  @media (max-height: 760px) and (min-width: 640px) { .quiz-board { min-height: 500px; } }

  .category-card {
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 1px solid rgb(255 255 255 / 10%);
    padding: 12px 8px; text-align: center;
    background: linear-gradient(145deg, var(--c-start), var(--c-end));
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 12%);
  }
  .category-card h2 {
    margin: 0; color: #fff;
    font-size: 1.75rem; line-height: 1; text-transform: uppercase; letter-spacing: 0.015em;
  }
  @media (min-width: 640px) { .category-card h2 { font-size: 2rem; } }
  @media (min-width: 1024px) { .category-card h2 { font-size: 2.4rem; } }

  .clue-card {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; border: 1px solid rgb(255 255 255 / 30%);
    padding: 0;
    background: linear-gradient(145deg, var(--c-start) 0%, var(--c-end) 100%);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 10%), 0 8px 16px rgb(0 4 30 / 24%);
    transition: transform 150ms, border-color 150ms, opacity 200ms;
  }
  .clue-card:not(:disabled):hover { transform: translateY(-2px); border-color: rgb(255 255 255 / 80%); }
  .clue-card:not(:disabled):active { transform: translateY(1px); }
  .clue-card:not(:disabled)::after {
    position: absolute; inset: 0; content: ""; opacity: 0;
    background: linear-gradient(135deg, rgb(255 255 255 / 12%), transparent 55%);
    transition: opacity 180ms ease;
  }
  .clue-card:not(:disabled):hover::after { opacity: 1; }
  .clue-value {
    color: #fff; font-size: 2.25rem; letter-spacing: 0.015em;
    text-shadow: 0 3px 0 rgb(0 0 0 / 18%);
  }
  @media (min-width: 640px) { .clue-value { font-size: 3rem; } }
  @media (min-width: 1024px) { .clue-value { font-size: 3.75rem; } }
  .clue-card:disabled {
    cursor: default;
    border-color: rgb(255 255 255 / 55%);
    background:
      radial-gradient(circle at center, rgb(255 255 255 / 18%) 0 2px, transparent 3px),
      linear-gradient(145deg, var(--c-start), var(--c-end));
    background-size: 11px 11px, auto;
    box-shadow: inset 0 0 30px rgb(0 0 0 / 18%);
    opacity: 0.32;
  }

  footer {
    margin-top: 12px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--ink-soft);
  }
  .hint { display: none; }
  @media (min-width: 640px) { .hint { display: block; } }

  /* Modals */
  .backdrop {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    overflow-y: auto;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    animation: fade-in 180ms ease-out;
  }
  .backdrop[hidden] { display: none; }
  .backdrop-soft { background: rgb(15 23 42 / 55%); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .backdrop-deep { background: rgb(2 7 31 / 85%); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

  .score-panel {
    width: 100%; max-width: 42rem;
    border-radius: 24px; border: 1px solid var(--line);
    background: var(--panel);
    padding: 20px;
    box-shadow: 0 25px 50px -12px rgb(0 0 0 / 30%);
  }
  @media (min-width: 640px) { .score-panel { padding: 28px; } }
  .panel-head { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .panel-kicker { margin: 0; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.22em; color: var(--accent); }
  .panel-title { margin: 0; font-size: 2.25rem; text-transform: uppercase; color: var(--ink); }
  @media (min-width: 640px) { .panel-title { font-size: 3rem; } }
  .close-btn {
    border-radius: 999px; border: 1px solid var(--line); background: var(--surface-solid);
    padding: 8px 16px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--ink-soft);
  }
  .close-btn:hover { background: var(--btn-light-hover); }

  .team-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 640px) { .team-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .team-card {
    position: relative; overflow: hidden;
    border-radius: 16px; border: 1px solid var(--line); background: var(--surface-solid);
    padding: 16px;
  }
  .team-card .bar { position: absolute; left: 0; right: 0; top: 0; height: 6px; }
  .team-name { margin: 4px 0 0; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.17em; color: var(--ink-soft); }
  .team-score { margin: 4px 0 0; font-size: 1.875rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }

  .clue-modal {
    position: relative; overflow: hidden;
    margin: auto 0;
    width: 100%; max-width: 48rem;
    border-radius: 24px; border: 1px solid rgb(255 255 255 / 15%);
    padding: 24px; text-align: center; color: #fff;
    background: linear-gradient(145deg, var(--c-start), var(--c-end));
    box-shadow: 0 25px 50px -12px rgb(0 0 0 / 50%);
    animation: modal-in 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (min-width: 640px) { .clue-modal { padding: 36px; } }
  .modal-shine {
    position: absolute; inset: 0; pointer-events: none;
    background:
      linear-gradient(110deg, transparent 20%, rgb(255 255 255 / 5%) 50%, transparent 80%),
      radial-gradient(circle at 100% 100%, rgb(255 216 77 / 8%), transparent 16rem);
  }
  .modal-inner { position: relative; }
  .modal-meta { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .modal-cat { margin: 0; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.24em; color: rgb(255 255 255 / 75%); }
  .modal-points { margin: 0; font-size: 1.5rem; }

  .enlarged {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; min-height: 18rem;
    border-radius: 16px; border: 1px solid rgb(255 255 255 / 25%);
    background: rgb(255 255 255 / 10%);
    padding: 40px 24px; color: #fff;
    box-shadow: inset 0 2px 4px rgb(0 0 0 / 8%);
    transition: transform 150ms, background-color 150ms;
  }
  .enlarged:hover { transform: scale(1.01); background: rgb(255 255 255 / 15%); }
  .enlarged .big { font-size: 4.5rem; letter-spacing: 0.03em; line-height: 1; }
  @media (min-width: 640px) { .enlarged .big { font-size: 8rem; } }
  .enlarged .tap { margin-top: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.22em; color: rgb(255 255 255 / 70%); }
  @media (min-width: 640px) { .enlarged .tap { font-size: 12px; } }

  .picker { border-radius: 16px; background: rgb(255 255 255 / 10%); padding: 12px; }
  @media (min-width: 640px) { .picker { padding: 16px; } }
  .picker-q { margin: 0 0 12px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.18em; }
  .pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 640px) { .pick-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .pick {
    border-radius: 12px; border: 1px solid rgb(255 255 255 / 20%); background: #fff;
    padding: 10px 12px; text-align: left; color: #172554;
    transition: transform 150ms, background-color 150ms;
  }
  .pick:hover { transform: translateY(-2px); background: #f8fafc; }
  .pick-name { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; }
  .dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }
  .pick-change { margin-top: 4px; display: block; font-size: 12px; font-weight: 600; color: #64748b; }
  .nobody {
    margin-top: 12px; width: 100%;
    border-radius: 12px; border: 1px solid rgb(255 255 255 / 25%); background: rgb(0 0 0 / 10%);
    padding: 12px 20px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.13em; color: #fff;
  }
  .nobody:hover { background: rgb(0 0 0 / 20%); }

  @keyframes fade-in { from { opacity: 0; } }
  @keyframes modal-in { from { opacity: 0; transform: translateY(18px) scale(0.97); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important; scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="background-glow" aria-hidden="true"></div>

<div class="page">
  <header>
    <div>
      <p class="event">Power Up Day 2027</p>
      <h1 class="display-font">HPE musikk-jeopardy</h1>
    </div>
    <div class="actions">
      <button type="button" class="pill pill-dark" id="open-scores">Poengtavle</button>
      <button type="button" class="pill pill-light" id="reset">
        <span class="short">Nullstill</span><span class="long">Nullstill brettet</span>
      </button>
    </div>
  </header>

  <section class="board-shell">
    <div class="quiz-board" id="board"></div>
  </section>

  <footer>
    <span id="remaining">24 spørsmål igjen</span>
    <span class="hint">Velg en kategori og poengsum for å begynne</span>
  </footer>
</div>

<div class="backdrop backdrop-soft" id="scoreboard" role="dialog" aria-modal="true" aria-labelledby="scoreboard-title" hidden>
  <section class="score-panel" id="score-panel">
    <div class="panel-head">
      <div>
        <p class="panel-kicker">8 lag</p>
        <h2 id="scoreboard-title" class="display-font panel-title">Poengtavle</h2>
      </div>
      <button type="button" class="close-btn" id="close-scores">Lukk</button>
    </div>
    <div class="team-grid" id="team-grid"></div>
  </section>
</div>

<div class="backdrop backdrop-deep" id="clue" role="dialog" aria-modal="true" aria-labelledby="clue-category" hidden>
  <article class="clue-modal" id="clue-modal">
    <div class="modal-shine" aria-hidden="true"></div>
    <div class="modal-inner">
      <div class="modal-meta">
        <p id="clue-category" class="modal-cat"></p>
        <p class="display-font modal-points" id="clue-points"></p>
      </div>
      <div id="clue-body"></div>
    </div>
  </article>
</div>

<script>
(function () {
  var categories = [
    { name: "Tall", clues: [
      { question: "Hvor mange dager er det i en uke?", answer: "7 dager" },
      { question: "Hva er det første primtallet etter 11?", answer: "13" },
      { question: "Hva er 12 × 12?", answer: "144" },
      { question: "Hvilket tall skrives som L med romertall?", answer: "50" } ] },
    { name: "Farge", clues: [
      { question: "Hvilken farge får du når du blander blått og gult?", answer: "Grønn" },
      { question: "Hvilken farge har den midterste stripen i det franske flagget?", answer: "Hvit" },
      { question: "Hvilken farge har edelsteinen smaragd?", answer: "Grønn" },
      { question: "Hva heter fargestoffet som gjør planter grønne?", answer: "Klorofyll" } ] },
    { name: "Dyr", clues: [
      { question: "Hva er verdens største landdyr?", answer: "Afrikansk elefant" },
      { question: "Hvilket dyr er kjent for å bygge demninger?", answer: "Beveren" },
      { question: "Hva kalles en gruppe med løver?", answer: "En flokk" },
      { question: "Hvilket pattedyr kan fly?", answer: "Flaggermusen" } ] },
    { name: "Sted", clues: [
      { question: "Hva heter hovedstaden i Norge?", answer: "Oslo" },
      { question: "I hvilket land ligger byen Barcelona?", answer: "Spania" },
      { question: "Hva heter verdens største hav?", answer: "Stillehavet" },
      { question: "På hvilket kontinent ligger Kilimanjaro?", answer: "Afrika" } ] },
    { name: "Språk", clues: [
      { question: "Hva heter «takk» på engelsk?", answer: "Thank you" },
      { question: "Hvilket språk snakkes hovedsakelig i Brasil?", answer: "Portugisisk" },
      { question: "Hva kalles et ord som betyr det motsatte av et annet ord?", answer: "Et antonym" },
      { question: "Hvilket språk har flest morsmålsbrukere i verden?", answer: "Mandarin-kinesisk" } ] },
    { name: "Kropp", clues: [
      { question: "Hvor mange fingre har et menneske vanligvis til sammen?", answer: "10" },
      { question: "Hvilket organ pumper blod rundt i kroppen?", answer: "Hjertet" },
      { question: "Hva heter kroppens største organ?", answer: "Huden" },
      { question: "Hvor mange knokler har et voksent menneske vanligvis?", answer: "206" } ] }
  ];

  var categoryColors = [
    { start: "#ef4444", end: "#be123c" },
    { start: "#f59e0b", end: "#d97706" },
    { start: "#10b981", end: "#047857" },
    { start: "#0ea5e9", end: "#2563eb" },
    { start: "#8b5cf6", end: "#6d28d9" },
    { start: "#ec4899", end: "#be185d" }
  ];
  var teamColors = ["#ef4444", "#f97316", "#eab308", "#22c55e", "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899"];
  var TEAMS = 8;
  var TOTAL = categories.length * 4;
  var STORAGE_KEY = "hpe-jeopardy-state-v1";

  var state = { scores: new Array(TEAMS).fill(0), used: [] };
  var selected = null;
  var lastFocus = null;

  // Restore a game in progress so a page refresh doesn't wipe the scores
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (saved && Array.isArray(saved.scores) && saved.scores.length === TEAMS && Array.isArray(saved.used)) {
      state = saved;
    }
  } catch (e) {}

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  var $ = function (id) { return document.getElementById(id); };
  var key = function (c, i) { return c + "-" + i; };
  var isUsed = function (c, i) { return state.used.indexOf(key(c, i)) !== -1; };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function setColors(node, c) {
    node.style.setProperty("--c-start", categoryColors[c].start);
    node.style.setProperty("--c-end", categoryColors[c].end);
  }

  function renderBoard() {
    var board = $("board");
    board.innerHTML = "";
    categories.forEach(function (cat, c) {
      var head = el("div", "category-card");
      setColors(head, c);
      head.style.gridColumn = c + 1;
      head.style.gridRow = 1;
      head.appendChild(el("h2", "display-font", cat.name));
      board.appendChild(head);

      cat.clues.forEach(function (_, i) {
        var value = (i + 1) * 100;
        var used = isUsed(c, i);
        var btn = el("button", "clue-card");
        btn.type = "button";
        btn.disabled = used;
        setColors(btn, c);
        btn.style.gridColumn = c + 1;
        btn.style.gridRow = i + 2;
        btn.setAttribute("aria-label", cat.name + " for " + value + " poeng" + (used ? ", allerede besvart" : ""));
        if (!used) {
          btn.appendChild(el("span", "display-font clue-value", String(value)));
          btn.addEventListener("click", function () { openClue(c, i, btn); });
        }
        board.appendChild(btn);
      });
    });
    $("remaining").textContent = (TOTAL - state.used.length) + " spørsmål igjen";
  }

  function renderScoreboard() {
    var grid = $("team-grid");
    grid.innerHTML = "";
    state.scores.forEach(function (score, t) {
      var card = el("div", "team-card");
      var bar = el("span", "bar");
      bar.style.backgroundColor = teamColors[t];
      bar.setAttribute("aria-hidden", "true");
      card.appendChild(bar);
      card.appendChild(el("p", "team-name", "Lag " + (t + 1)));
      card.appendChild(el("p", "team-score", String(score)));
      grid.appendChild(card);
    });
  }

  function openClue(c, i, trigger) {
    lastFocus = trigger;
    selected = { c: c, i: i, value: (i + 1) * 100 };
    var modal = $("clue-modal");
    setColors(modal, c);
    $("clue-category").textContent = categories[c].name;
    $("clue-points").textContent = selected.value + " poeng";
    showValue();
    $("clue").hidden = false;
    var first = $("clue-body").querySelector("button");
    if (first) first.focus();
  }

  function showValue() {
    var body = $("clue-body");
    body.innerHTML = "";
    var btn = el("button", "enlarged");
    btn.type = "button";
    btn.appendChild(el("span", "display-font big", String(selected.value)));
    btn.appendChild(el("span", "tap", "Trykk igjen for å fordele poengene"));
    btn.addEventListener("click", showPicker);
    body.appendChild(btn);
  }

  function showPicker() {
    var body = $("clue-body");
    body.innerHTML = "";
    var wrap = el("div", "picker");
    wrap.appendChild(el("p", "picker-q", "Hvilket lag svarte riktig?"));
    var grid = el("div", "pick-grid");
    state.scores.forEach(function (score, t) {
      var b = el("button", "pick");
      b.type = "button";
      var name = el("span", "pick-name");
      var dot = el("span", "dot");
      dot.style.backgroundColor = teamColors[t];
      dot.setAttribute("aria-hidden", "true");
      name.appendChild(dot);
      name.appendChild(document.createTextNode("Lag " + (t + 1)));
      b.appendChild(name);
      b.appendChild(el("span", "pick-change", score + " → " + (score + selected.value)));
      b.addEventListener("click", function () { finishClue(t); });
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
    var none = el("button", "nobody", "Ingen fikk poeng");
    none.type = "button";
    none.addEventListener("click", function () { finishClue(null); });
    wrap.appendChild(none);
    body.appendChild(wrap);
    grid.querySelector("button").focus();
  }

  function finishClue(t) {
    if (!selected) return;
    if (t !== null) state.scores[t] += selected.value;
    var k = key(selected.c, selected.i);
    if (state.used.indexOf(k) === -1) state.used.push(k);
    selected = null;
    $("clue").hidden = true;
    save();
    renderBoard();
    renderScoreboard();
    var next = document.querySelector(".clue-card:not(:disabled)");
    (next || $("open-scores")).focus();
  }

  function openScores() {
    lastFocus = document.activeElement;
    renderScoreboard();
    $("scoreboard").hidden = false;
    $("close-scores").focus();
  }
  function closeScores() {
    $("scoreboard").hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function resetGame() {
    if (state.used.length > 0 && !confirm("Vil du nullstille brettet? Alle poeng blir slettet.")) return;
    state = { scores: new Array(TEAMS).fill(0), used: [] };
    selected = null;
    $("clue").hidden = true;
    save();
    renderBoard();
    renderScoreboard();
  }

  $("open-scores").addEventListener("click", openScores);
  $("close-scores").addEventListener("click", closeScores);
  $("scoreboard").addEventListener("click", closeScores);
  $("score-panel").addEventListener("click", function (e) { e.stopPropagation(); });
  $("reset").addEventListener("click", resetGame);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("scoreboard").hidden) closeScores();
  });

  renderBoard();
  renderScoreboard();
})();
</script>
</body>
</html>
